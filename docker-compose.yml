name: uo3-local

services:
  postgres:
    image: postgres:17.2-alpine
    profiles: ["core"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PG_USER:-uo3}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-CHANGE_ME_LOCAL_DEV_ONLY}
      POSTGRES_DB: uo3_dev
    ports:
      - "${PG_PORT:-5432}:5432"
    volumes:
      - uo3_pg_data:/var/lib/postgresql/data
      - ./infra/local/postgres/init-dbs.sql:/docker-entrypoint-initdb.d/01-init-dbs.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-uo3} -d uo3_dev"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - uo3-net

  valkey:
    image: valkey/valkey:8.0.2-alpine
    profiles: ["core"]
    restart: unless-stopped
    command: ["valkey-server", "--appendonly", "yes"]
    ports:
      - "${VALKEY_PORT:-6379}:6379"
    volumes:
      - uo3_valkey_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks:
      - uo3-net

  nats:
    image: nats:2.10.25-alpine
    profiles: ["core"]
    restart: unless-stopped
    command: ["-c", "/etc/nats/nats.conf"]
    ports:
      - "${NATS_PORT:-4222}:4222"
      - "${NATS_MONITOR_PORT:-8222}:8222"
    volumes:
      - uo3_nats_data:/data/jetstream
      - ./infra/local/nats/nats.conf:/etc/nats/nats.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8222/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks:
      - uo3-net

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.118.0
    profiles: ["observability"]
    restart: unless-stopped
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    ports:
      - "${OTEL_GRPC_PORT:-4317}:4317"
      - "${OTEL_HTTP_PORT:-4318}:4318"
    volumes:
      - ./infra/local/otel/otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    healthcheck:
      test: ["CMD", "/otelcol-contrib", "validate", "--config=/etc/otelcol-contrib/config.yaml"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - uo3-net

  prometheus:
    image: prom/prometheus:v3.1.0
    profiles: ["observability"]
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-remote-write-receiver"
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - uo3_prom_data:/prometheus
      - ./infra/local/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9090/-/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - uo3-net

  loki:
    image: grafana/loki:3.3.2
    profiles: ["observability"]
    restart: unless-stopped
    command: ["-config.file=/etc/loki/local-config.yaml"]
    ports:
      - "${LOKI_PORT:-3100}:3100"
    volumes:
      - uo3_loki_data:/loki
      - ./infra/local/loki/loki-config.yaml:/etc/loki/local-config.yaml:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3100/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - uo3-net

  tempo:
    image: grafana/tempo:2.7.0
    profiles: ["observability"]
    restart: unless-stopped
    command: ["-config.file=/etc/tempo.yaml"]
    ports:
      - "${TEMPO_PORT:-3200}:3200"
    volumes:
      - uo3_tempo_data:/var/tempo
      - ./infra/local/tempo/tempo-config.yaml:/etc/tempo.yaml:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3200/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - uo3-net

  grafana:
    image: grafana/grafana:11.4.0
    profiles: ["observability"]
    restart: unless-stopped
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    volumes:
      - uo3_grafana_data:/var/lib/grafana
      - ./infra/local/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_healthy
      tempo:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - uo3-net

networks:
  uo3-net:
    driver: bridge

volumes:
  uo3_pg_data:
  uo3_valkey_data:
  uo3_nats_data:
  uo3_prom_data:
  uo3_loki_data:
  uo3_tempo_data:
  uo3_grafana_data:
