name: "Setup UO3 Workspace"
description: "Configure Node 22 (.nvmrc), Corepack/pnpm 9, pnpm store cache, frozen install, and Turborepo cache with safe fork-PR fallback"

inputs:
  turbo-token:
    description: "Optional Turborepo remote cache token"
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: Setup Node.js 22 from .nvmrc
      uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
      with:
        node-version-file: ".nvmrc"

    - name: Enable Corepack and activate pnpm 9
      shell: bash
      run: |
        corepack enable
        corepack prepare pnpm@9.15.9 --activate
        pnpm -v

    - name: Resolve pnpm store directory
      id: pnpm-cache
      shell: bash
      run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

    - name: Cache pnpm store
      uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
      with:
        path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
        key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-pnpm-store-

    - name: Fallback local Turborepo cache (when remote TURBO_TOKEN is unset, e.g. fork PRs)
      if: ${{ inputs.turbo-token == '' }}
      uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
      with:
        path: .turbo
        key: ${{ runner.os }}-turbo-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-turbo-

    - name: Install dependencies (frozen lockfile)
      shell: bash
      run: pnpm install --frozen-lockfile
