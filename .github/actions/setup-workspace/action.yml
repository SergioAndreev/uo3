name: Подготовка рабочего пространства
description: Node.js из .nvmrc, pnpm через Corepack, кэши и установка зависимостей
inputs:
  turbo-token:
    description: Токен удалённого кэша Turborepo; пустой у PR из форков
    required: false
    default: ''
  turbo-team:
    description: Команда удалённого кэша
    required: false
    default: ''
  turbo-api:
    description: Адрес сервера удалённого кэша
    required: false
    default: ''
runs:
  using: composite
  steps:
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version-file: .nvmrc
    - id: pnpm
      shell: bash
      run: |
        corepack enable
        echo "store=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
    - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ${{ steps.pnpm.outputs.store }}
        key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: pnpm-${{ runner.os }}-
    - name: Удалённый кэш Turborepo
      if: inputs.turbo-token != ''
      shell: bash
      env:
        TOKEN: ${{ inputs.turbo-token }}
        TEAM: ${{ inputs.turbo-team }}
        API: ${{ inputs.turbo-api }}
      run: |
        echo "TURBO_TOKEN=$TOKEN" >> "$GITHUB_ENV"
        if [ -n "$TEAM" ]; then echo "TURBO_TEAM=$TEAM" >> "$GITHUB_ENV"; fi
        if [ -n "$API" ]; then echo "TURBO_API=$API" >> "$GITHUB_ENV"; fi
    - name: Кэш Turborepo в GitHub Actions
      if: inputs.turbo-token == ''
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: .turbo/cache
        key: turbo-${{ runner.os }}-${{ github.job }}-${{ github.sha }}
        restore-keys: |
          turbo-${{ runner.os }}-${{ github.job }}-
          turbo-${{ runner.os }}-
    - shell: bash
      env:
        HUSKY: '0'
      run: pnpm install --frozen-lockfile
