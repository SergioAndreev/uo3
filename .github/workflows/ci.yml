name: CI

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CI: "true"
  TURBO_TELEMETRY_DISABLED: "1"
  OPENSPEC_TELEMETRY: "0"

jobs:
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      full_run: ${{ steps.diff.outputs.full_run }}
      base_sha: ${{ steps.diff.outputs.base_sha }}
      openspec_changes: ${{ steps.diff.outputs.openspec_changes }}
      retention_days: ${{ steps.diff.outputs.retention_days }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Compute affected scope and OpenSpec changes
        id: diff
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "full_run=true" >> "$GITHUB_OUTPUT"
            echo "base_sha=${{ github.event.before }}" >> "$GITHUB_OUTPUT"
            echo "retention_days=30" >> "$GITHUB_OUTPUT"
            CHANGED_FILES=$(git diff --name-only "${{ github.event.before }}...${{ github.sha }}" 2>/dev/null || true)
          else
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
            echo "base_sha=${BASE_SHA}" >> "$GITHUB_OUTPUT"
            echo "retention_days=14" >> "$GITHUB_OUTPUT"
            CHANGED_FILES=$(git diff --name-only "${BASE_SHA}...${{ github.sha }}")
            if echo "$CHANGED_FILES" | grep -Eq '^(package\.json|pnpm-lock\.yaml|pnpm-workspace\.yaml|turbo\.json|tsconfig\.base\.json|eslint\.config\.mjs|\.prettierrc|\.dependency-cruiser\.mjs|\.github/|packages/config/|scripts/)'; then
              echo "full_run=true" >> "$GITHUB_OUTPUT"
            else
              echo "full_run=false" >> "$GITHUB_OUTPUT"
            fi
          fi
          OPENSPEC_IDS=$(echo "$CHANGED_FILES" | sed -nE 's|^openspec/changes/([^/]+)/.*|\1|p' | sort -u | tr '\n' ' ')
          echo "openspec_changes=${OPENSPEC_IDS}" >> "$GITHUB_OUTPUT"

  lint:
    name: Lint & Boundaries
    needs: [detect-changes]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace
        with:
          turbo-token: ${{ secrets.TURBO_TOKEN }}

      - name: Run ESLint, Prettier, boundaries, and workspace manifest checks
        env:
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
          TURBO_TEAM: ${{ vars.TURBO_TEAM }}
          TURBO_API: ${{ vars.TURBO_API }}
        run: |
          pnpm format:check
          pnpm check:workspace-manifests
          pnpm check:boundaries
          if [ "${{ needs.detect-changes.outputs.full_run }}" = "true" ]; then
            pnpm lint
          else
            pnpm exec eslint .
            pnpm turbo run lint --filter="...[${{ needs.detect-changes.outputs.base_sha }}]"
          fi

  typecheck:
    name: Typecheck
    needs: [detect-changes]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace
        with:
          turbo-token: ${{ secrets.TURBO_TOKEN }}

      - name: Run TypeScript typecheck
        env:
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
          TURBO_TEAM: ${{ vars.TURBO_TEAM }}
          TURBO_API: ${{ vars.TURBO_API }}
        run: |
          if [ "${{ needs.detect-changes.outputs.full_run }}" = "true" ]; then
            pnpm typecheck
          else
            pnpm turbo run typecheck --filter="...[${{ needs.detect-changes.outputs.base_sha }}]"
          fi

  test:
    name: Unit & Integration Tests
    needs: [detect-changes]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.2-alpine
        env:
          POSTGRES_USER: uo3
          POSTGRES_PASSWORD: CHANGE_ME_LOCAL_DEV_ONLY
          POSTGRES_DB: uo3_dev
        ports:
          - "5432:5432"
        options: >-
          --health-cmd="pg_isready -U uo3 -d uo3_dev"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=12

      valkey:
        image: valkey/valkey:8.0.2-alpine
        ports:
          - "6379:6379"
        options: >-
          --health-cmd="valkey-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=12

      nats:
        image: nats:2.10.25-alpine
        ports:
          - "4222:4222"
          - "8222:8222"
        options: >-
          --health-cmd="wget -qO- http://127.0.0.1:8222/healthz || exit 1"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=12
    env:
      DATABASE_URL: postgresql://uo3:CHANGE_ME_LOCAL_DEV_ONLY@127.0.0.1:5432/uo3_dev
      TEST_DATABASE_URL: postgresql://uo3:CHANGE_ME_LOCAL_DEV_ONLY@127.0.0.1:5432/uo3_test
      VALKEY_URL: redis://127.0.0.1:6379
      NATS_URL: nats://127.0.0.1:4222
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace
        with:
          turbo-token: ${{ secrets.TURBO_TOKEN }}

      - name: Initialize uo3_test database and apply migrations
        run: |
          pnpm --filter @uo3/db exec node --input-type=module -e '
            import pg from "pg";
            const c = new pg.Client({ connectionString: process.env.DATABASE_URL });
            await c.connect();
            const exists = await c.query("SELECT 1 FROM pg_database WHERE datname = $1", ["uo3_test"]);
            if (exists.rowCount === 0) {
              await c.query("CREATE DATABASE uo3_test");
            }
            await c.end();
          '
          pnpm build
          pnpm db:migrate
          pnpm db:seed

      - name: Run unit tests with layer coverage thresholds
        env:
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
          TURBO_TEAM: ${{ vars.TURBO_TEAM }}
          TURBO_API: ${{ vars.TURBO_API }}
        run: |
          pnpm test
          if [ "${{ needs.detect-changes.outputs.full_run }}" = "true" ]; then
            pnpm test:coverage
          else
            pnpm turbo run test:coverage --filter="...[${{ needs.detect-changes.outputs.base_sha }}]"
          fi

      - name: Run integration tests against service containers
        run: pnpm test:integration

      - name: Upload test reports and coverage artifacts
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: test-and-coverage-reports
          retention-days: ${{ fromJSON(needs.detect-changes.outputs.retention_days) }}
          if-no-files-found: warn
          path: |
            **/test-results/**
            **/coverage/lcov.info
            **/coverage/coverage-summary.json

  build:
    name: Build & Bundle Stats
    needs: [detect-changes]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace
        with:
          turbo-token: ${{ secrets.TURBO_TOKEN }}

      - name: Build packages and applications
        env:
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
          TURBO_TEAM: ${{ vars.TURBO_TEAM }}
          TURBO_API: ${{ vars.TURBO_API }}
        run: |
          if [ "${{ needs.detect-changes.outputs.full_run }}" = "true" ]; then
            pnpm build
          else
            pnpm turbo run build --filter="...[${{ needs.detect-changes.outputs.base_sha }}]"
          fi

      - name: Upload client and admin bundle stats
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: bundle-stats
          retention-days: ${{ fromJSON(needs.detect-changes.outputs.retention_days) }}
          if-no-files-found: warn
          path: |
            apps/client/dist/bundle-stats.json
            apps/admin/dist/bundle-stats.json

  quality-gates:
    name: Quality & Supply Chain Gates
    needs: [detect-changes]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace
        with:
          turbo-token: ${{ secrets.TURBO_TOKEN }}

      - name: Check Conventional Commits on PR commits and title
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          echo "${{ github.event.pull_request.title }}" | pnpm exec commitlint
          pnpm exec commitlint --from "${{ github.event.pull_request.base.sha }}" --to "${{ github.event.pull_request.head.sha }}"

      - name: Check Changesets policy on PR
        if: ${{ github.event_name == 'pull_request' }}
        env:
          CHANGESET_BASE_REF: ${{ github.event.pull_request.base.sha }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: pnpm check:changeset

      - name: Check legal asset gate (ADR-002), secrets, env parity, licenses, audit, and CI integrity
        run: |
          pnpm check:assets
          pnpm check:secrets
          pnpm check:env
          pnpm check:licenses
          pnpm check:audit
          pnpm check:ci-integrity
          pnpm vitest run scripts/renovate-policy.test.ts

      - name: Validate touched OpenSpec changes strictly
        if: ${{ needs.detect-changes.outputs.openspec_changes != '' }}
        run: |
          npm install -g @fission-ai/openspec
          for change_id in ${{ needs.detect-changes.outputs.openspec_changes }}; do
            echo "Validating OpenSpec change: $change_id"
            OPENSPEC_TELEMETRY=0 openspec validate "$change_id" --strict
          done

  ci-required:
    name: ci-required
    needs: [lint, typecheck, test, build, quality-gates]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify all mandatory CI stages succeeded
        run: |
          echo "lint=${{ needs.lint.result }}"
          echo "typecheck=${{ needs.typecheck.result }}"
          echo "test=${{ needs.test.result }}"
          echo "build=${{ needs.build.result }}"
          echo "quality-gates=${{ needs.quality-gates.result }}"
          if [ "${{ needs.lint.result }}" != "success" ] || \
             [ "${{ needs.typecheck.result }}" != "success" ] || \
             [ "${{ needs.test.result }}" != "success" ] || \
             [ "${{ needs.build.result }}" != "success" ] || \
             [ "${{ needs.quality-gates.result }}" != "success" ]; then
            echo "One or more mandatory CI jobs did not succeed." >&2
            exit 1
          fi
